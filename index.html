<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102d35">
  <title>NBUFinanc — Академия финансовой грамотности</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-frame">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" aria-label="NBUFinanc"><span class="brand-mark">N</span><span class="brand-name">NBU<span>Financ</span><small id="brandCaption"></small></span></a>
      <div class="sidebar-content">
        <small class="nav-caption" id="learningCaption"></small>
        <nav id="mainNav" aria-label="Навигация"></nav>
        <small class="nav-caption topic-caption" id="topicCaption"></small>
        <nav id="topicNav" aria-label="Темы"></nav>
      </div>
      <div class="sidebar-help"><span class="help-icon">?</span><div><b id="helpTitle"></b><p id="helpText"></p></div><button id="helpButton" class="text-button"></button></div>
      <div class="sidebar-foot">NBUFinanc <span>·</span> Academy</div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Menu">☰</button>
        <div class="mobile-brand"><span class="brand-mark">N</span><b>NBU<span>Financ</span></b></div>
        <label class="searchbox"><span>⌕</span><input id="searchInput" type="search" autocomplete="off"><kbd>⌘ K</kbd></label>
        <div class="topbar-actions">
          <span class="live-pill" id="onlinePill" title="Счётчик активных пользователей в этом браузере"><i></i><b id="onlineCount">0</b><small id="onlineLabel"></small></span><select id="languageSelect" class="language-select" aria-label="Язык"><option value="ru">RU</option><option value="en">EN</option><option value="uz">UZ</option></select>
          <button id="accountButton" class="account-button"><span class="avatar" id="accountAvatar">У</span><span class="account-name" id="accountName"></span><span class="account-chevron">⌄</span></button>
        </div>
      </header>
      <main id="mainContent" tabindex="-1"></main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <script src="content.js"></script>
  <script src="curriculum.js"></script>
  <script src="course-savings.js"></script>
  <script src="course-investing.js"></script>
  <script src="course-qrpayments.js"></script>
  <script src="course-bigpurchase.js"></script>
  <script src="curriculum-final.js"></script>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
  <script src="presence.js"></script>
  <script src="app.js"></script>
</body>
</html>
